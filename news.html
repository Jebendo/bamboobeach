<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bamboo Beach</title>
<style>
    /* Reset and basic styles */
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
    body, html { height: 100%; }

    /* Background */
    body {
        /*background: url('https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=1350&q=80') no-repeat center center fixed;*/
        background-image: url('D:/Luka/Bamboo/old - New/images/back.png');
        background-size: cover;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        color: #fff;
        background-position: center;
    }

    /* Overlay to darken background */
    body::before {
        content: '';
        position: absolute;
        top:0; left:0;
        width:100%; height:100%;
        background: rgba(0,0,0,0.4);
        z-index: -1;
    }

    header {
        text-align: center;
        padding: 50px 20px 20px 20px;
        font-size: 2.5em;
        font-weight: bold;
        text-shadow: 2px 2px 5px #000000;
    }

    main {
        flex: 1;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
    }

    .calculator {
        background: rgba(255, 255, 255, 0.9);
        color: #888888;
        padding: 30px;
        border-radius: 15px;
        max-width: 400px;
        width: 100%;
        box-shadow: 0 0 15px rgba(0,0,0,0.3);
    }

    .calculator input, .calculator select, .calculator button, .result {
        width: 100%;
        padding: 10px;
        margin: 10px 0;
        font-size: 1em;
        border-radius: 5px;
        border: 0px solid #ccc;
    }

    .calculator button {
        background-color: #979695;
        color: #fff;
        border: none;
        cursor: pointer;
        font-weight: bold;
    }

    .calculator button:hover {
        background-color: #e68900;
    }

    .result {
        margin-top: 15px;
        font-size: 1.2em;
        font-weight: bold;
    }

    footer {
        text-align: center;
        padding: 20px;
        background: rgba(0,0,0,0.5);
        font-size: 1em;
        text-shadow: 1px 1px 3px #000;
    }

    /* Responsive */
    
    @media (max-width: 480px) {
        header { font-size: 2em; padding: 30px 10px 10px 10px; }
        .calculator { padding: 20px; }
    }

    /* Remove arrows in Chrome, Edge, Safari */
input[type=number]::-webkit-outer-spin-button,
input[type=number]::-webkit-inner-spin-button {
    -webkit-appearance: none;
    margin: 0;
}

/* Remove arrows in Firefox */
input[type=number] {
    -moz-appearance: textfield;
}


.icon {
  display: inline-block;
  animation: bounce 1s infinite alternate;
  margin: 0 10px;
  font-size: 1.2em; /* make icon a bit bigger */
}

.icon2 {
  display: inline-block;
  animation: bounce 2s infinite alternate;
  margin: 0 10px;
  font-size: 1.2em; /* make icon a bit bigger */
}

@keyframes bounce {
  0% { transform: translateY(0); }
  50% { transform: translateY(-10px); }

}


</style>
</head>
<body>

<header>Welcome to <br> Bamboo Beach</header>

<main>
  
    <div class="calculator">
          <!-- <div class="fee-period">მომსახურების ვადა / Fee period</div>-->
          <select id="field5"> 
            
           <option value="" disabled selected>მომსახურების ვადა / Fee period</option>
             <option value="1">სრული წელი /Full Year</option>
             <option value="2">ნახევარი წელი / Half Year</option>
            </select>
        <input type="number" id="field1" placeholder="ბინა და აივანი / Apt & Balcony">
        <input type="number" id="field2" placeholder="კომერციული ფართი / Commercial Space">
        <input type="number" id="field3" placeholder="ტერასა / Terrace">
        <input type="number" id="field4" placeholder="დამხმარე ფართი / Support Area">
        <input type="number" id="field6" placeholder="ავტოფარეხი / Parking">
        
        
        <!-- <button onclick="calculateFee()">Calculate Fee</button> */ - why i cant comment it out -->
        <div class="result" id="result">Total Fee:</div>
        <button type="button" onclick="clearFields()">Clear</button>

    </div>
</main>

<footer>
  <span class="icon2">🚧</span>
  <span class="icon">🚧</span>
  Under Construction
  <span class="icon">🚧</span>
  <span class="icon2">🚧</span>
</footer>


<script>
function calculateFee() {
    const f1 = parseFloat(document.getElementById('field1').value) || 0;
    const f2 = parseFloat(document.getElementById('field2').value) || 0;
    const f3 = parseFloat(document.getElementById('field3').value) || 0;
    const f4 = parseFloat(document.getElementById('field4').value) || 0;
    const f5 = parseFloat(document.getElementById('field5').value) || 0;
    const f6 = parseFloat(document.getElementById('field6').value) || 0;

    const total = f1 + f2 + f3 + f4 + f5 + f6;
    document.getElementById('result').textContent = "Total Fee: $" + total.toFixed(2);
}

// Add event listeners to inputs and dropdown
const inputs = document.querySelectorAll('#field1, #field2, #field3, #field4, #field5, #field6');
inputs.forEach(input => {
    input.addEventListener('input', calculateFee); // triggers on typing or changing
});

function clearFields() {
    const inputs = ['field1','field2','field3','field4','field5','field6'];
    inputs.forEach(id => {
        const el = document.getElementById(id);
        if(el.tagName === 'SELECT') {
            el.selectedIndex = 0; // reset dropdown
        } else {
            el.value = ''; // reset input
        }
    });
    document.getElementById('result').textContent = "Total Fee:";
}

</script>


</body>
</html>
